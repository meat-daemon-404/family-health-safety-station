<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="家庭药箱：药品录入、有效期提醒、用药提醒、症状找药、家庭共享、常备药参考。">
<title>家庭药箱 - 家庭健康与安全守护站</title>
<script>window.BASE = "../";</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="yixiang">
<div id="site-header"></div>

<main class="container">
  <h1 class="section-title" style="margin-top:10px" data-updated>💊 家庭药箱</h1>
  <p class="text-light">录入家里的药品，到期自动提醒、按点提醒服药；数据保存在本机浏览器（加入家庭后云端共享）。</p>

  <div id="reminder-banner" class="reminder-banner" style="display:none"></div>

  <div class="disclaimer">⚠️ 免责声明：本站内容仅供科普参考，不能替代专业医疗诊断。用药请遵医嘱或药师指导，如遇紧急情况请立刻拨打 120。</div>

  <section class="card">
    <h2 id="form-title">➕ 录入药品</h2>
    <form id="med-form">
      <div class="form-row-3">
        <div>
          <label for="f-name">药品名称 *</label>
          <input type="text" id="f-name" placeholder="如：布洛芬缓释胶囊" required>
        </div>
        <div>
          <label for="f-category">类别</label>
          <select id="f-category">
            <option value="退热镇痛">退热镇痛</option>
            <option value="感冒">感冒</option>
            <option value="肠胃">肠胃</option>
            <option value="抗过敏">抗过敏</option>
            <option value="外用">外用</option>
            <option value="慢性病用药">慢性病用药</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div>
          <label for="f-quantity">数量</label>
          <input type="number" id="f-quantity" min="0" value="1">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label for="f-opened">开封日期</label>
          <input type="date" id="f-opened">
        </div>
        <div>
          <label for="f-expiry">有效期至 *</label>
          <input type="date" id="f-expiry" required>
        </div>
      </div>
      <div>
        <label for="f-reminders">服用提醒（每日多个时间点，用逗号分隔，如 08:00,20:00）</label>
        <input type="text" id="f-reminders" placeholder="例如：08:00,20:00（可不填）">
      </div>
      <div>
        <label for="f-note">备注</label>
        <input type="text" id="f-note" placeholder="如：饭后服用、儿童减量、置于阴凉处……">
      </div>
      <div class="mt-2 buy-links-row">
        <button type="submit" class="btn btn-primary">保存药品</button>
        <button type="button" class="btn btn-ghost" id="cancel-edit" style="display:none">取消编辑</button>
        <button type="button" class="btn btn-green" id="notify-btn">🔔 开启服药提醒</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2>📋 我的药品</h2>
    <div class="med-summary">
      <div class="med-stat"><div class="num" id="stat-total">0</div><div class="label">药品总数</div></div>
      <div class="med-stat"><div class="num" id="stat-expired" style="color:var(--danger)">0</div><div class="label">已过期</div></div>
      <div class="med-stat"><div class="num" id="stat-soon" style="color:var(--warning)">0</div><div class="label">30天内到期</div></div>
    </div>
    <input type="search" id="med-search" class="search-input" placeholder="按名称 / 类别 / 备注搜索药品" aria-label="搜索药品">
    <ul class="med-list mt-2" id="med-list"></ul>
  </section>

  <section class="card">
    <h2>🤒 症状找药</h2>
    <p class="text-light">不舒服时先看症状，再找药。点击下方按钮选择你的症状。</p>
    <button type="button" class="btn btn-green" id="sym-open">我有什么症状？</button>
    <div id="symptom-box" class="symptom-box" style="display:none">
      <div class="filter-chips" id="symptom-chips"></div>
      <div id="symptom-result"></div>
    </div>
  </section>

  <section class="card">
    <h2>🏠 家庭共享</h2>
    <div id="family-panel" class="family-panel">
      <div id="family-status"><span class="family-note">正在连接云端…</span></div>
    </div>
  </section>

  <details>
    <summary>📚 家庭常备药参考</summary>
    <div id="med-ref"></div>
  </details>

  <details>
    <summary>🧭 安全用药常识</summary>
    <div id="med-sense"></div>
  </details>

  <div class="disclaimer">⚠️ 免责声明：本站内容仅供科普参考，不能替代专业医疗诊断。如遇紧急情况，请立刻拨打 120。</div>
</main>

<div id="site-footer"></div>
<script src="../js/data-medicine.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/links.js"></script>
<script src="../js/app-yixiang.js"></script>
<script src="../js/common.js"></script>
<script defer src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
</body>
</html>
